name: Preserve disposable QA evidence
description: Upload synthetic fixture reports, logs and browser failure captures.
inputs:
  profile:
    description: Verification profile associated with this evidence.
    default: full
  owner:
    description: Unique job or shard evidence owner.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: qa-evidence-${{ inputs.profile }}-${{ inputs.owner }}
        overwrite: true
        path: |
          data/outputs/ci/**/*.json
          data/outputs/system-audit/**/*.json
          data/outputs/system-audit/**/*.log
          data/outputs/system-audit/**/failure*.png
          data/outputs/system-audit/**/failure*.txt
        if-no-files-found: error
