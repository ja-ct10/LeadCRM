name: Set up isolated LeadCRM QA
description: Install locked workspaces and only the tooling required by this job.
inputs:
  postgres:
    description: Install native PostgreSQL 18.
    default: 'false'
  browser:
    description: Install the locked Playwright Chrome distribution.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: package-lock.json
        package-manager-cache: false
    - name: Install pinned npm and locked dependencies
      shell: bash
      run: |
        npm install --global npm@11.19.1
        npm ci --include=dev
        npm --prefix backend run db:generate
    - name: Install PostgreSQL 18
      if: inputs.postgres == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-common openssl
        sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
        sudo apt-get update
        sudo apt-get install -y postgresql-18 postgresql-client-18
        /usr/lib/postgresql/18/bin/postgres --version
        echo "POSTGRES_TEST_BIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
    - name: Install Chrome
      if: inputs.browser == 'true'
      shell: bash
      run: npx playwright install --with-deps chrome
