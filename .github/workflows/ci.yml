name: CI — Lint & Typecheck

on:
  push:
    branches: [main, dev-copy-1]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Monorepo: lock file lives at root, not in subpackage directories
          cache-dependency-path: package-lock.json

      - name: Install dependencies (monorepo root)
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

  backend:
    name: Backend — TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (monorepo root)
        run: npm ci

      - name: TypeScript check
        working-directory: backend
        run: npx tsc --noEmit

  shared:
    name: Shared Package — TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (monorepo root)
        run: npm ci

      - name: TypeScript check
        working-directory: shared
        run: npx tsc --noEmit
