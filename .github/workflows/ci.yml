name: CI — Local acceptance and container compatibility

on:
  push:
    branches: [main, dev-copy-1]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Clean checkout — build, isolated QA, native PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false
      - name: Select pinned npm and install locked workspaces
        run: |
          npm install --global npm@11.19.1
          npm --version
          npm ci --include=dev
      - name: Install local browser and PostgreSQL tooling
        run: |
          npx playwright install --with-deps chrome
          sudo apt-get update
          sudo apt-get install -y postgresql-common openssl
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-client-18
          /usr/lib/postgresql/18/bin/postgres --version
          echo "POSTGRES_TEST_BIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
      - name: Generate Prisma client
        run: npm --prefix backend run db:generate
      - name: Execute counted local acceptance
        run: npm run qa:local -- --native
      - name: Verify generated contract companions
        run: git diff --exit-code -- shared/src
      - name: Preserve QA counts and fixture evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: disposable-qa-evidence
          path: |
            data/outputs/system-audit/**/*.json
            data/outputs/system-audit/**/*.log
            data/outputs/system-audit/**/failure*.png
            data/outputs/system-audit/**/failure*.txt
            data/outputs/*-browser/results.json
            .tmp/*-browser/results.json
          if-no-files-found: error
  containers:
    name: Root-context Docker compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build backend including guarded migration entrypoint
        run: docker build -f infrastructure/docker/Dockerfile.backend -t leadcrm-backend:qa .
      - name: Build frontend standalone output
        run: docker build -f infrastructure/docker/Dockerfile.frontend --build-arg API_URL=https://leadcrm-build.example/api/v1 -t leadcrm-frontend:qa .
      - name: Validate compose contract with dummy values
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          BACKEND_ENV_FILE: ../../backend/.env.example
          API_URL: https://leadcrm-build.example/api/v1
        run: docker compose -f infrastructure/docker/docker-compose.yml config --quiet
