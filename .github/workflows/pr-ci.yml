name: CI — Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  full:
    name: Complete verification
    uses: ./.github/workflows/ci.yml
  required:
    name: PR CI — Required Gate
    if: always()
    needs: [full]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require complete acceptance
        env:
          FULL_CI_RESULT: ${{ needs.full.result }}
        run: test "$FULL_CI_RESULT" = success
