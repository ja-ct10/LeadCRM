name: CI — Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: ${{ matrix.label }} — TypeScript Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {workspace: frontend, label: Frontend}
          - {workspace: backend, label: Backend}
          - {workspace: shared, label: Shared Package}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-qa
      - run: npm run qa:typecheck -- --ci --profile=pr --workspace=${{ matrix.workspace }}
      - uses: ./.github/actions/qa-evidence
        if: always()
        with:
          profile: pr
          owner: typecheck-${{ matrix.workspace }}

  backend_unit:
    name: Backend — Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-qa
      - run: npm test -- --ci --profile=pr --workspace=backend
      - uses: ./.github/actions/qa-evidence
        if: always()
        with:
          profile: pr
          owner: backend-unit

  frontend_unit:
    name: Frontend — Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-qa
      - run: npm test -- --ci --profile=pr --workspace=frontend
      - uses: ./.github/actions/qa-evidence
        if: always()
        with:
          profile: pr
          owner: frontend-unit

  build:
    name: Production Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-qa
      - run: npm run qa:build -- --ci --profile=pr
      - name: Verify generated contract companions
        run: git diff --exit-code -- shared/src
      - uses: ./.github/actions/qa-evidence
        if: always()
        with:
          profile: pr
          owner: build

  required:
    name: PR CI — Required Gate
    if: always()
    needs: [typecheck, backend_unit, frontend_unit, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: qa-evidence-pr-*
          path: data/outputs/ci-evidence
          merge-multiple: false
      - name: Require all fast checks and matching evidence
        if: always()
        run: node scripts/qa-ci.mjs pr-gate data/outputs/ci-evidence
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
