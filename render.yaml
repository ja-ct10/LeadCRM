# render.yaml — Render deployment configuration for LeadCRM backend
# Docs: https://render.com/docs/infrastructure-as-code
#
# IMPORTANT: Set the following env vars in the Render dashboard (not here):
#   DATABASE_URL             — Render Internal DB URL (postgresql://...@<internal-host>/...)
#   JWT_SECRET               — strong random string, min 32 chars  (run: openssl rand -base64 48)
#   ALLOWED_ORIGINS          — https://lead-crm-frontend-pi.vercel.app
#   APP_URL                  — https://lead-crm-frontend-pi.vercel.app
#   NODE_ENV                 — production
#   SYSTEM_ADMIN_EMAIL       — your real admin email (never admin@gmail.com in production)
#   SYSTEM_ADMIN_PASSWORD    — REQUIRED: a strong unique password (NOT admin123).
#                              The seeder will throw if this is left as the default.
#   DEMO_MODE                — DO NOT set to true in production. This enables auth bypasses.
#   DEV_OTP_BYPASS           — DO NOT set to true in production. This bypasses email verification.
#   DEV_SEED_EMAILS          — optional: comma-separated emails for seeded demo accounts
#   SKIP_DEMO_TENANTS        — true  (skip faker tenant generation in production)
#   RESEND_API_KEY           — (optional) your Resend API key for email delivery

services:
  - type: web
    name: leadcrm-backend
    runtime: node
    rootDir: backend

    # Install deps, generate Prisma client, compile TypeScript
    buildCommand: >
      npm install &&
      npx prisma generate &&
      npx tsc

    # Apply migrations then seed demo accounts then start the server
    # - prisma migrate deploy: safe for production (no data loss, no resets)
    # - prisma db seed: idempotent — upserts only, safe on every deploy
    # - SKIP_DEMO_TENANTS=true: skip the faker 10-tenant generator in production
    startCommand: >
      npx prisma migrate deploy &&
      SKIP_DEMO_TENANTS=true npx prisma db seed &&
      node dist/server.js

    envVars:
      - key: NODE_ENV
        value: production
      # All secret env vars must be set in the Render dashboard — never committed here
